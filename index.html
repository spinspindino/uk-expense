<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>英鎊記帳</title>
  <meta name="theme-color" content="#0a0a0c">
  <!-- 讓 iPhone「加入主畫面」後以全螢幕 app 的樣子開啟 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="英鎊記帳">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600&family=Big+Shoulders+Display:wght@700;800&family=Cormorant+Garamond:ital,wght@1,500&family=IBM+Plex+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 分頁一：記帳（每個月的明細） -->
  <section id="viewLedger" class="view">
  <header class="top">
    <button class="icon-btn" id="prevMonth" aria-label="上個月">‹</button>
    <h1 id="monthTitle">2026.10</h1>
    <button class="icon-btn" id="nextMonth" aria-label="下個月">›</button>
    <button class="icon-btn menu-btn" id="exportBtn" aria-label="匯出這個月的 CSV">CSV</button>
  </header>

  <main>
    <section class="summary">
      <div class="sum-block">
        <span class="label">本月支出 · OUT</span>
        <span class="value" id="sumOut">£0.00</span>
      </div>
      <div class="sum-block">
        <span class="label">本月收入 · IN</span>
        <span class="value income" id="sumIn">£0.00</span>
      </div>
    </section>

    <section class="block" id="budgetBox"></section>
    <section class="block" id="catBox"></section>

    <section id="list" class="list" aria-live="polite"></section>
    <div id="empty" class="empty" hidden>
      <p class="line">Nothing spent. Yet.</p>
      <p class="label">按右下角的 ＋ 記第一筆</p>
    </div>
  </main>

  <button class="fab" id="addBtn" aria-label="新增一筆">＋</button>
  </section>

  <!-- 分頁二：總覽（現金、可支應月數、預算） -->
  <section id="viewOverview" class="view" hidden>
    <header class="top">
      <h1>總覽</h1>
      <button class="icon-btn menu-btn" id="settingsBtn">設定</button>
    </header>
    <main>
      <section class="ov-block">
        <span class="label">目前現金 · CASH</span>
        <span class="big" id="ovCash">—</span>
        <p class="note" id="ovCashNote"></p>
      </section>
      <section class="ov-block">
        <span class="label">可支應月數 · RUNWAY</span>
        <span class="big" id="ovRunway">—</span>
        <p class="note" id="ovRunwayNote"></p>
      </section>
      <section class="ov-block">
        <span class="label" id="ovBudgetLabel">本月預算 · BUDGET</span>
        <div id="ovBudget"></div>
      </section>
    </main>
  </section>

  <!-- 下方分頁列 -->
  <nav class="tabbar" aria-label="分頁">
    <button type="button" class="tab on" data-view="viewLedger">記帳<span class="label">LEDGER</span></button>
    <button type="button" class="tab" data-view="viewOverview">總覽<span class="label">OVERVIEW</span></button>
  </nav>

  <!-- 設定面板：每月預算、現金餘額 -->
  <dialog id="settingsSheet" class="sheet">
    <form id="settingsForm" method="dialog" autocomplete="off">
      <div class="sheet-head">
        <button type="button" class="text-btn" id="settingsCancel">取消</button>
        <span class="sheet-title">設定</span>
        <button type="submit" class="save-btn">儲存</button>
      </div>

      <label class="field">
        <span class="label">每月預算（£）</span>
        <input id="setBudget" inputmode="decimal" placeholder="例如 750">
        <span class="hint">預算進度和可支應月數都用這個數字算。</span>
      </label>

      <label class="field">
        <span class="label">現金餘額（£）</span>
        <input id="setCash" inputmode="decimal" placeholder="打開銀行 app 看到的數字">
      </label>
      <label class="field">
        <span class="label">這是哪一天結束時的餘額</span>
        <input type="date" id="setCashDate">
        <span class="hint">這天之後記的收入會加上去、支出會扣掉。之後想對帳，再輸入一次新的餘額和日期就好，過去的紀錄不會被改動。</span>
      </label>

      <p class="error" id="settingsError" hidden></p>

      <div class="field">
        <span class="label">備份</span>
        <button type="button" class="link-btn" id="exportAllBtn">匯出全部紀錄</button>
        <span class="hint">記帳頁右上的 CSV 只匯出正在看的那個月，檔名像 2026-10.csv。這裡一次匯出所有月份（檔名像 all-2026-10-24.csv），換手機前或想完整備份時用。</span>
      </div>
    </form>
  </dialog>

  <!-- 新增／編輯用的底部面板 -->
  <dialog id="sheet" class="sheet">
    <form id="form" method="dialog" autocomplete="off">
      <div class="sheet-head">
        <button type="button" class="text-btn" id="cancelBtn">取消</button>
        <div class="segmented" id="typeSeg" role="radiogroup" aria-label="類型">
          <button type="button" data-value="支出" class="on">支出</button>
          <button type="button" data-value="收入">收入</button>
        </div>
        <button type="submit" class="save-btn" id="saveBtn">儲存</button>
      </div>

      <label class="amount-row">
        <span class="currency">£</span>
        <input id="amount" inputmode="decimal" placeholder="0.00" aria-label="金額" enterkeyhint="done">
        <span id="amountMeasure" class="amount-measure" aria-hidden="true"></span>
      </label>

      <div class="field">
        <span class="label">類別</span>
        <div class="chips" id="categoryChips"></div>
      </div>

      <div class="field">
        <span class="label">付款方式</span>
        <div class="segmented wide" id="paySeg"></div>
      </div>

      <div class="field two">
        <label>
          <span class="label">日期</span>
          <input type="date" id="date">
        </label>
        <label class="biz">
          <input type="checkbox" id="business">
          <span>業務成本</span>
        </label>
      </div>

      <label class="field">
        <span class="label">說明（可不填）</span>
        <input id="note" placeholder="例如：Tesco 買菜">
      </label>

      <p class="error" id="error" hidden></p>
      <button type="button" class="delete-btn" id="deleteBtn" hidden>刪除這筆</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
